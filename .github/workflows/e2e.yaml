name: "e2e"
on:
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "NOTICE"
      - "LICENSE"
  push:
    paths-ignore:
      - "**/*.md"
      - "NOTICE"
      - "LICENSE"
    branches:
      - "main"

permissions:
  contents: read
  id-token: write

jobs:
  build:
    runs-on: "ubuntu-22.04"
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        label-filter:
          - full-backup
          - incremental-backup
          - misc
          - finbackupconfig
        kubernetes-version:
          - "1.34.4"
          - "1.35.1"
    env:
      KUBERNETES_VERSION: ${{ matrix.kubernetes-version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-go
        with:
          go-version-file: "go.mod"
          cache: false
          takumi-guard-bot-id: ${{ vars.TAKUMI_GUARD_BOT_ID }}

      - uses: ./.github/actions/set-up-kvm-for-e2e-tests
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      # The custom-ceph stage is expensive but rarely changes, so cache it using
      # the Dockerfile hash. The key is branch-independent, meaning an entry
      # created on the main branch can be restored from any pull request.
      - name: Restore custom-ceph cache
        id: cache-custom-ceph
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/custom-ceph-cache
          key: custom-ceph-${{ hashFiles('Dockerfile') }}

      - name: Build custom-ceph stage
        if: steps.cache-custom-ceph.outputs.cache-hit != 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          target: custom-ceph
          cache-to: type=local,dest=/tmp/custom-ceph-cache

      # Only main saves the cache: a PR-saved cache cannot be restored by
      # other branches anyway, and not saving prevents cache poisoning.
      - name: Save custom-ceph cache
        if: github.ref == 'refs/heads/main' && steps.cache-custom-ceph.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/custom-ceph-cache
          key: custom-ceph-${{ hashFiles('Dockerfile') }}

      # setup-go does not create .netrc for forked pull requests because they use
      # anonymous mode; authenticated runs create it.
      - name: Ensure the netrc file exists
        run: |
          touch "${HOME}/.netrc"
          chmod 600 "${HOME}/.netrc"

      - name: Build Docker image with cache
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          build-args: |
            GOPROXY=${{ env.GOPROXY }}
          context: .
          tags: controller:latest
          load: true
          cache-from: type=local,src=/tmp/custom-ceph-cache
          secret-files: |
            netrc=/home/runner/.netrc

      - name: Get versions
        id: versions
        run: |
          {
            echo "rook=$(grep '^ROOK_CHART_VERSION' versions.mk | cut -d'=' -f2 | tr -d ' ')"
            echo "ceph=$(grep '^CEPH_IMAGE_VERSION' versions.mk | cut -d'=' -f2 | tr -d ' ')"
            echo "cephcsi=$(grep '^CEPH_CSI_IMAGE_VERSION' versions.mk | cut -d'=' -f2 | tr -d ' ')"
          } >> "$GITHUB_OUTPUT"

      # rook/ceph images are large and rarely change, so cache them keyed by
      # their versions. The key is branch-independent, meaning an entry created
      # on the main branch can be restored from any pull request.
      - name: Restore rook-ceph image cache
        id: cache-rook-images
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/rook-images
          key: rook-images-${{ steps.versions.outputs.rook }}-${{ steps.versions.outputs.ceph }}-${{ steps.versions.outputs.cephcsi }}

      - name: Pull and save rook-ceph images
        if: steps.cache-rook-images.outputs.cache-hit != 'true'
        env:
          ROOK_VERSION: ${{ steps.versions.outputs.rook }}
          CEPH_VERSION: ${{ steps.versions.outputs.ceph }}
          CEPH_CSI_VERSION: ${{ steps.versions.outputs.cephcsi }}
        run: |
          mkdir -p /tmp/rook-images
          docker pull "docker.io/rook/ceph:${ROOK_VERSION}"
          docker pull "quay.io/ceph/ceph:${CEPH_VERSION}"
          docker pull "quay.io/cephcsi/cephcsi:${CEPH_CSI_VERSION}"
          docker save "docker.io/rook/ceph:${ROOK_VERSION}" -o /tmp/rook-images/rook-ceph.tar
          docker save "quay.io/ceph/ceph:${CEPH_VERSION}" -o /tmp/rook-images/ceph-ceph.tar
          docker save "quay.io/cephcsi/cephcsi:${CEPH_CSI_VERSION}" -o /tmp/rook-images/cephcsi.tar

      # Only main saves the cache: a PR-saved cache cannot be restored by
      # other branches anyway, and not saving prevents cache poisoning.
      - name: Save rook-ceph image cache
        if: github.ref == 'refs/heads/main' && steps.cache-rook-images.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/rook-images
          key: rook-images-${{ steps.versions.outputs.rook }}-${{ steps.versions.outputs.ceph }}-${{ steps.versions.outputs.cephcsi }}

      - name: Setup minikube with kvm2 driver
        run: |
            make -C test/e2e launch-minikube

      - name: Load image into minikube
        run: |
            make -C test/e2e image-tar-load
            # Display disk usage after loading image
            df -h /

      - name: Load rook-ceph images into minikube
        env:
          ROOK_OPERATOR_IMAGE_TAR: /tmp/rook-images/rook-ceph.tar
          CEPH_IMAGE_TAR: /tmp/rook-images/ceph-ceph.tar
          CEPH_CSI_IMAGE_TAR: /tmp/rook-images/cephcsi.tar
        run: make -C test/e2e load-rook-images

      - name: Launch rook-ceph and deploy components
        run: |
          make -C test/e2e launch-rook-ceph
          make -C test/e2e setup-fin-volume
          make -C test/e2e setup-components

      - name: Run e2e tests
        run: |
          make -C test/e2e do-test \
          GINKGO_FLAGS=--label-filter='${{ matrix.label-filter }}'
