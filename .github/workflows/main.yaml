name: "Main"
on:
  pull_request:
    paths-ignore:
      - "**/*.md"
  push:
    paths-ignore:
      - "**/*.md"
    branches:
      - "main"

permissions:
  contents: read

jobs:
  build:
    name: "build"
    runs-on: "ubuntu-22.04"
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: "go.mod"
      - run: go mod tidy && make generate && make manifests && make check-uncommitted
      - run: make build
      - run: make lint
      - run: make test
