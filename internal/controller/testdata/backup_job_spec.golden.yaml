backoffLimit: 65535
podFailurePolicy:
  rules:
  - action: FailJob
    onExitCodes:
      containerName: backup
      operator: In
      values:
      - 2
      - 4
template:
  metadata: {}
  spec:
    containers:
    - args:
      - backup
      command:
      - /manager
      env:
      - name: ACTION_UID
        value: fb-uid
      - name: RBD_POOL
        value: test-pool
      - name: RBD_IMAGE_NAME
        value: test-image
      - name: BACKUP_SNAPSHOT_ID
        value: "7"
      - name: SOURCE_CANDIDATE_SNAPSHOT_ID
        value: "3"
      - name: BACKUP_TARGET_PVC_NAME
        value: pvc1
      - name: BACKUP_TARGET_PVC_NAMESPACE
        value: user
      - name: BACKUP_TARGET_PVC_UID
        value: pvc-uid
      - name: MAX_PART_SIZE
        value: "1073741824"
      - name: FIN_RAW_IMG_EXPANSION_UNIT_SIZE
        value: "2048"
      - name: FIN_RAW_CHECKSUM_CHUNK_SIZE
        value: "4096"
      - name: FIN_DIFF_CHECKSUM_CHUNK_SIZE
        value: "8192"
      - name: ENABLE_CHECKSUM_VERIFY
        valueFrom:
          configMapKeyRef:
            key: ENABLE_CHECKSUM_VERIFY
            name: fin-checksum-verify-fb-uid
      image: sample-image
      imagePullPolicy: IfNotPresent
      name: backup
      resources: {}
      volumeMounts:
      - mountPath: /etc/ceph
        name: ceph-config
      - mountPath: /volume
        name: fin-volume
    initContainers:
    - command:
      - /bin/bash
      - -c
      - |
        #!/bin/sh

        # This shell script is forked from:
        #
        #     https://github.com/rook/rook/blob/5aff5c1ded7c5b5a7a7ec1416319b6f751126658/images/ceph/toolbox.sh
        #
        # It is distributed under Apache-2.0 license:
        #
        #     Copyright 2016 The Rook Authors. All rights reserved.
        #
        #     Licensed under the Apache License, Version 2.0 (the "License");
        #     you may not use this file except in compliance with the License.
        #     You may obtain a copy of the License at
        #
        #         http://www.apache.org/licenses/LICENSE-2.0
        #
        #     Unless required by applicable law or agreed to in writing, software
        #     distributed under the License is distributed on an "AS IS" BASIS,
        #     WITHOUT WARRANTIES OR CONDITIONS OF ANY KIND, either express or implied.
        #     See the License for the specific language governing permissions and
        #     limitations under the License.
        #
        # NOTE: watch_endpoints function is not included in this script.
        #       This is because the function prevents the job from completing.

        set -e
        set -o pipefail

        # Replicate the script from toolbox.sh inline so the ceph image
        # can be run directly, instead of requiring the rook toolbox
        CEPH_CONFIG="/etc/ceph/ceph.conf"
        MON_CONFIG="/etc/rook/mon-endpoints"
        KEYRING_FILE="/etc/ceph/keyring"

        # create a ceph config file in its default location so ceph/rados tools can be used
        # without specifying any arguments
        write_endpoints() {
          endpoints=$(cat ${MON_CONFIG})

          # filter out the mon names
          # external cluster can have numbers or hyphens in mon names, handling them in regex
          # shellcheck disable=SC2001
          mon_endpoints=$(echo "${endpoints}"| sed 's/[a-z0-9_-]\+=//g')

          DATE=$(date)
          echo "$DATE writing mon endpoints to ${CEPH_CONFIG}: ${endpoints}"
            cat <<EOF > ${CEPH_CONFIG}
        [global]
        mon_host = ${mon_endpoints}

        [client.admin]
        keyring = ${KEYRING_FILE}
        EOF
        }

        # read the secret from an env var (for backward compatibility), or from the secret file
        ceph_secret=${ROOK_CEPH_SECRET}
        if [[ "$ceph_secret" == "" ]]; then
          ceph_secret=$(cat /var/lib/rook-ceph-mon/secret.keyring)
        fi

        # create the keyring file
        cat <<EOF > ${KEYRING_FILE}
        [${ROOK_CEPH_USERNAME}]
        key = ${ceph_secret}
        EOF

        # write the initial config file
        write_endpoints
      env:
      - name: ROOK_CEPH_USERNAME
        valueFrom:
          secretKeyRef:
            key: ceph-username
            name: rook-ceph-mon
      image: sample-image
      imagePullPolicy: IfNotPresent
      name: toolbox
      resources: {}
      securityContext:
        runAsGroup: 2016
        runAsNonRoot: true
        runAsUser: 2016
      volumeMounts:
      - mountPath: /var/lib/rook-ceph-mon
        name: ceph-admin-secret
        readOnly: true
      - mountPath: /etc/ceph
        name: ceph-config
      - mountPath: /etc/rook
        name: mon-endpoint-volume
    nodeName: node1
    restartPolicy: Never
    securityContext:
      fsGroup: 10000
      runAsGroup: 10000
      runAsNonRoot: true
      runAsUser: 10000
    serviceAccountName: fin-backup-job
    volumes:
    - name: ceph-admin-secret
      secret:
        items:
        - key: ceph-secret
          path: secret.keyring
        optional: false
        secretName: rook-ceph-mon
    - emptyDir: {}
      name: ceph-config
    - name: fin-volume
      persistentVolumeClaim:
        claimName: fin-node1
    - configMap:
        items:
        - key: data
          path: mon-endpoints
        name: rook-ceph-mon-endpoints
      name: mon-endpoint-volume
