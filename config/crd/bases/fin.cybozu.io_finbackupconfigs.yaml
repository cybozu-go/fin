metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: finbackupconfigs.fin.cybozu.io
spec:
  group: fin.cybozu.io
  names:
    kind: FinBackupConfig
    listKind: FinBackupConfigList
    plural: finbackupconfigs
    singular: finbackupconfig
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.schedule
      name: SCHEDULE
      type: string
    - jsonPath: .spec.suspend
      name: SUSPEND
      type: boolean
    - jsonPath: .status.node
      name: NODE
      type: string
    - jsonPath: .status.latestBackup.snapshotTime
      name: LATEST BACKUP
      type: date
    - jsonPath: .status.latestVerifiedBackup.snapshotTime
      name: LATEST VERIFIED
      type: date
    - jsonPath: .metadata.creationTimestamp
      name: AGE
      type: date
    - jsonPath: .spec.pvc
      name: PVC
      priority: 1
      type: string
    - jsonPath: .spec.pvcNamespace
      name: PVC NAMESPACE
      priority: 1
      type: string
    name: v1
    schema:
      openAPIV3Schema:
        description: FinBackupConfig is the Schema for the finbackupconfigs API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: FinBackupConfigSpec defines the desired state of FinBackupConfig
            properties:
              node:
                description: |-
                  Node is the node the FinBackups of this config are taken on. It is
                  spec.node when set, and otherwise a node selected by the controller.
                type: string
              pvc:
                type: string
                x-kubernetes-validations:
                - message: spec.pvc is immutable
                  rule: self == oldSelf
              pvcNamespace:
                type: string
                x-kubernetes-validations:
                - message: spec.pvcNamespace is immutable
                  rule: self == oldSelf
              schedule:
                pattern: ^\s*([0-5]?[0-9])\s+(0?[0-9]|1[0-9]|2[0-3])\s+\*\s+\*\s+\*\s*$
                type: string
              suspend:
                default: false
                type: boolean
            required:
            - pvc
            - pvcNamespace
            - schedule
            type: object
          status:
            description: FinBackupConfigStatus defines the observed state of FinBackupConfig
            properties:
              latestBackup:
                description: |-
                  LatestBackup summarizes the FinBackup with the latest creation timestamp
                  for this config, excluding backups being deleted. The greatest UID wins
                  when timestamps are equal. It is unset if no eligible FinBackup exists.
                properties:
                  ref:
                    description: FinBackupReference refers to a FinBackup in the same
                      namespace.
                    properties:
                      name:
                        description: Name is the name of the referenced FinBackup.
                        type: string
                      uid:
                        description: UID identifies the referenced FinBackup even
                          if its name is reused.
                        type: string
                    required:
                    - name
                    - uid
                    type: object
                  snapshotTime:
                    description: |-
                      SnapshotTime is the source snapshot's creation time.
                      It is unset until the FinBackup reports the timestamp in status.createdAt.
                    format: date-time
                    type: string
                required:
                - ref
                type: object
              latestVerifiedBackup:
                description: |-
                  LatestVerifiedBackup summarizes the FinBackup with the latest snapshot time
                  among the FinBackups of this config whose Verified condition is True,
                  excluding backups being deleted. The greatest UID wins when snapshot times
                  are equal. It is unset if no eligible FinBackup exists.
                properties:
                  ref:
                    description: FinBackupReference refers to a FinBackup in the same
                      namespace.
                    properties:
                      name:
                        description: Name is the name of the referenced FinBackup.
                        type: string
                      uid:
                        description: UID identifies the referenced FinBackup even
                          if its name is reused.
                        type: string
                    required:
                    - name
                    - uid
                    type: object
                  snapshotTime:
                    description: |-
                      SnapshotTime is the source snapshot's creation time.
                      It is unset until the FinBackup reports the timestamp in status.createdAt.
